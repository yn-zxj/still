name: Build and publish macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build universal app
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      STILL_BUILD_DIR: ${{ github.workspace }}/.build
    outputs:
      upload_name: ${{ steps.package.outputs.upload_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Run tests
        run: bash scripts/test.sh

      - name: Build universal app bundle
        run: bash scripts/build-app.sh

      - name: Validate universal bundle
        run: bash scripts/validate-app.sh

      - name: Run packaged app verification
        shell: bash
        run: |
          set -euo pipefail
          app="dist/息间.app"
          "$app/Contents/MacOS/Still" --verify-bundle | tee dist/verify-build.json
          test "$(plutil -extract runtimeArchitecture raw dist/verify-build.json)" = "arm64"
          test "$(plutil -extract minimumSystemVersion raw dist/verify-build.json)" = "13.0"

      - name: Package app and checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          app="dist/息间.app"
          version="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist")"
          build="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$app/Contents/Info.plist")"
          minimum="$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$app/Contents/Info.plist")"
          arch="$(lipo -archs "$app/Contents/MacOS/Still" | tr ' ' '-')"
          artifact="dist/Still-${version}-${build}-${arch}-macos.zip"

          ditto -c -k --sequesterRsrc --keepParent "$app" "$artifact"
          unzip -t "$artifact"
          digest="$(shasum -a 256 "$artifact" | awk '{print $1}')"
          printf '%s  %s\n' "$digest" "$(basename "$artifact")" > "$artifact.sha256"

          cat > dist/artifact-manifest.json <<EOF
          {
            "product": "Still",
            "displayName": "息间",
            "version": "$version",
            "build": "$build",
            "minimumSystemVersion": "$minimum",
            "architectures": ["arm64", "x86_64"],
            "commit": "$GITHUB_SHA",
            "runner": "$ImageOS-$ImageVersion",
            "signature": "ad-hoc",
            "distribution": "GitHub Release / Actions artifact; not Developer ID signed or notarized"
          }
          EOF

          {
            echo "## 息间 ${version} (${build})"
            echo
            echo "- macOS ${minimum} 或更高版本"
            echo "- 通用架构：\`arm64 + x86_64\`，支持 Apple Silicon 与 Intel Mac"
            echo "- 构建提交：\`${GITHUB_SHA}\`"
            echo "- 流水线已分别验证 macOS 14 Apple Silicon 与 Intel 原生启动"
            echo "- 附件使用 ad-hoc 签名，尚未使用 Developer ID 签名，也未通过 Apple 公证"
            echo
            echo "### SHA-256"
            echo
            echo '```'
            cat "$artifact.sha256"
            echo '```'
          } > dist/release-notes.md

          {
            echo "## Still universal macOS build"
            echo
            echo "- Version: \`$version ($build)\`"
            echo "- Minimum macOS: \`$minimum\`"
            echo "- Architectures: \`$arch\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Archive: \`$(basename "$artifact")\`"
            echo "- SHA-256: \`$digest\`"
            echo "- Distribution: ad-hoc signed, not notarized"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "upload_name=Still-universal"
            echo "artifact_name=$(basename "$artifact")"
            echo "artifact_sha256=$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Upload universal app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.upload_name }}
          path: |
            dist/Still-*.zip
            dist/Still-*.zip.sha256
            dist/artifact-manifest.json
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 14

  runtime-arm64:
    name: Verify macOS 14 Apple Silicon runtime
    needs: build
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Download packaged app
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.upload_name }}
          path: runtime

      - name: Launch packaged arm64 slice
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          archive="$(find runtime -maxdepth 1 -name 'Still-*.zip' -print -quit)"
          mkdir expanded
          ditto -x -k "$archive" expanded
          app="$(find expanded -maxdepth 1 -name '息间.app' -print -quit)"
          codesign --verify --strict --verbose=2 "$app"
          "$app/Contents/MacOS/Still" --verify-bundle | tee runtime.json
          test "$(plutil -extract runtimeArchitecture raw runtime.json)" = "arm64"
          test "$(plutil -extract minimumSystemVersion raw runtime.json)" = "13.0"
          echo "Verified native arm64 startup on $(sw_vers -productVersion)." >> "$GITHUB_STEP_SUMMARY"

  runtime-x86_64:
    name: Verify Intel runtime
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 15

    steps:
      - name: Download packaged app
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.upload_name }}
          path: runtime

      - name: Launch packaged x86_64 slice
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          archive="$(find runtime -maxdepth 1 -name 'Still-*.zip' -print -quit)"
          mkdir expanded
          ditto -x -k "$archive" expanded
          app="$(find expanded -maxdepth 1 -name '息间.app' -print -quit)"
          codesign --verify --strict --verbose=2 "$app"
          "$app/Contents/MacOS/Still" --verify-bundle | tee runtime.json
          test "$(plutil -extract runtimeArchitecture raw runtime.json)" = "x86_64"
          test "$(plutil -extract minimumSystemVersion raw runtime.json)" = "13.0"
          echo "Verified native x86_64 startup on $(sw_vers -productVersion)." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, runtime-arm64, runtime-x86_64]
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.upload_name }}
          path: dist

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --latest \
              --title "息间 $(plutil -extract version raw dist/artifact-manifest.json)" \
              --notes-file dist/release-notes.md
          fi

          gh release upload "$GITHUB_REF_NAME" \
            dist/Still-*.zip \
            dist/Still-*.zip.sha256 \
            dist/artifact-manifest.json \
            --clobber
